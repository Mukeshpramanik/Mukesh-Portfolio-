<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="webBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="webCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="webVioletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="webGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#webBgGrad)" />

  <!-- Subtle Web Grid -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Browser Window Chrome -->
  <rect x="25" y="20" width="750" height="410" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <rect x="25" y="20" width="750" height="42" rx="10" fill="#131c31" />
  <rect x="25" y="52" width="750" height="10" fill="#131c31" />
  <line x1="25" y1="62" x2="775" y2="62" stroke="#1e293b" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="45" cy="41" r="5" fill="#ef4444" />
  <circle cx="62" cy="41" r="5" fill="#f59e0b" />
  <circle cx="79" cy="41" r="5" fill="#10b981" />

  <!-- Browser URL Address Bar -->
  <rect x="110" y="30" width="460" height="24" rx="6" fill="#0a0f1d" stroke="#1e293b" stroke-width="0.8" />
  <text x="125" y="46" fill="#10b981" font-family="monospace" font-size="10.5">https://</text>
  <text x="175" y="46" fill="#94a3b8" font-family="monospace" font-size="10.5">app.mukeshpramanik.dev/v1/dashboard</text>
  <rect x="545" y="35" width="14" height="14" rx="3" fill="#1e293b" />
  <path d="M548 42 L556 42 M552 38 L556 42 L552 46" stroke="#64748b" stroke-width="1.2" fill="none" />

  <!-- Viewport Device Indicators -->
  <g transform="translate(620, 32)">
    <rect x="0" y="0" width="36" height="20" rx="4" fill="#1e293b" />
    <text x="8" y="14" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">DESK</text>
    <rect x="42" y="0" width="34" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <text x="50" y="14" fill="#64748b" font-family="sans-serif" font-size="9">TAB</text>
    <rect x="82" y="0" width="34" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <text x="91" y="14" fill="#64748b" font-family="sans-serif" font-size="9">MOB</text>
  </g>

  <!-- Left Sidebar (App Layout Navigation) -->
  <rect x="25" y="62" width="160" height="368" fill="#0f1628" />
  <line x1="185" y1="62" x2="185" y2="430" stroke="#1e293b" stroke-width="1" />

  <!-- Sidebar Nav Items -->
  <g transform="translate(40, 85)">
    <!-- Active Nav -->
    <rect x="0" y="0" width="130" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#818cf8" />
    <text x="30" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Overview</text>

    <!-- Nav 2 -->
    <g transform="translate(0, 42)">
      <circle cx="16" cy="16" r="3.5" fill="#64748b" />
      <text x="30" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11">Components</text>
    </g>

    <!-- Nav 3 -->
    <g transform="translate(0, 84)">
      <circle cx="16" cy="16" r="3.5" fill="#64748b" />
      <text x="30" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11">API Services</text>
    </g>

    <!-- Nav 4 -->
    <g transform="translate(0, 126)">
      <circle cx="16" cy="16" r="3.5" fill="#64748b" />
      <text x="30" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11">Database</text>
    </g>

    <!-- Nav 5 -->
    <g transform="translate(0, 168)">
      <circle cx="16" cy="16" r="3.5" fill="#64748b" />
      <text x="30" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11">Settings</text>
    </g>
  </g>

  <!-- Server Health indicator in Sidebar Bottom -->
  <g transform="translate(40, 375)">
    <rect width="130" height="36" rx="6" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
    <circle cx="14" cy="18" r="3.5" fill="#10b981" />
    <text x="26" y="16" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">SSR Node Server</text>
    <text x="26" y="28" fill="#10b981" font-family="monospace" font-size="8.5">Active • 24ms</text>
  </g>

  <!-- Main Viewport Content -->
  <!-- Top Hero Card -->
  <g transform="translate(205, 80)">
    <rect width="550" height="120" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1" />
    <text x="20" y="28" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Full-Stack Application Architecture</text>
    <text x="20" y="46" fill="#64748b" font-family="sans-serif" font-size="10.5">Responsive UI Components, Server-Side Endpoints &amp; Client State Sync</text>

    <!-- 3 Tech Badge Blocks -->
    <g transform="translate(20, 64)">
      <rect x="0" y="0" width="155" height="42" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
      <text x="12" y="18" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Frontend Layer</text>
      <text x="12" y="32" fill="#bae6fd" font-family="monospace" font-size="9">React • Next.js • Tailwind</text>

      <rect x="175" y="0" width="155" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
      <text x="187" y="18" fill="#a5b4fc" font-family="sans-serif" font-size="10" font-weight="700">API Backend</text>
      <text x="187" y="32" fill="#c7d2fe" font-family="monospace" font-size="9">RESTful • JWT Auth • ORM</text>

      <rect x="350" y="0" width="155" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
      <text x="362" y="18" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">Storage / Cache</text>
      <text x="362" y="32" fill="#a7f3d0" font-family="monospace" font-size="9">PostgreSQL • Redis</text>
    </g>
  </g>

  <!-- Bottom Left: Interactive UI Component Cards -->
  <g transform="translate(205, 215)">
    <rect width="265" height="200" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1" />
    <text x="16" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="600">Active UI Components</text>

    <!-- Mock Card 1 -->
    <g transform="translate(16, 40)">
      <rect width="233" height="42" rx="6" fill="#161f33" stroke="#25334d" stroke-width="0.8" />
      <circle cx="16" cy="21" r="5" fill="#8b5cf6" />
      <text x="30" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">UserProfileCard.tsx</text>
      <text x="30" y="32" fill="#64748b" font-family="monospace" font-size="8.5">Props: user, onAction</text>
      <rect x="185" y="12" width="40" height="18" rx="3" fill="#065f46" />
      <text x="192" y="24" fill="#6ee7b7" font-family="monospace" font-size="8">RENDER</text>
    </g>

    <!-- Mock Card 2 -->
    <g transform="translate(16, 90)">
      <rect width="233" height="42" rx="6" fill="#161f33" stroke="#25334d" stroke-width="0.8" />
      <circle cx="16" cy="21" r="5" fill="#06b6d4" />
      <text x="30" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">DataGridTable.tsx</text>
      <text x="30" y="32" fill="#64748b" font-family="monospace" font-size="8.5">Pagination: 25 rows/page</text>
      <rect x="185" y="12" width="40" height="18" rx="3" fill="#065f46" />
      <text x="192" y="24" fill="#6ee7b7" font-family="monospace" font-size="8">RENDER</text>
    </g>

    <!-- Mock Card 3 -->
    <g transform="translate(16, 140)">
      <rect width="233" height="42" rx="6" fill="#161f33" stroke="#25334d" stroke-width="0.8" />
      <circle cx="16" cy="21" r="5" fill="#10b981" />
      <text x="30" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">ModalManager.tsx</text>
      <text x="30" y="32" fill="#64748b" font-family="monospace" font-size="8.5">State: portal mounted</text>
      <rect x="185" y="12" width="40" height="18" rx="3" fill="#1e293b" />
      <text x="194" y="24" fill="#94a3b8" font-family="monospace" font-size="8">IDLE</text>
    </g>
  </g>

  <!-- Bottom Right: Live API Response Stream Panel -->
  <g transform="translate(485, 215)">
    <rect width="270" height="200" rx="8" fill="#0c1220" stroke="#1f293d" stroke-width="1" />
    <rect x="0" y="0" width="270" height="28" rx="8" fill="#141c2e" />
    <rect x="0" y="20" width="270" height="8" fill="#141c2e" />
    <text x="14" y="18" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="600">HTTP Response Inspector</text>

    <!-- JSON / Code Output -->
    <g transform="translate(14, 45)" font-family="monospace" font-size="9">
      <text y="0" fill="#38bdf8">GET /api/v1/projects</text>
      <text x="180" y="0" fill="#10b981">200 OK</text>
      <text y="18" fill="#64748b">{</text>
      <text y="32" fill="#c7d2fe">&nbsp;&nbsp;"status": <tspan fill="#34d399">"success"</tspan>,</text>
      <text y="46" fill="#c7d2fe">&nbsp;&nbsp;"records": <tspan fill="#f59e0b">14</tspan>,</text>
      <text y="60" fill="#c7d2fe">&nbsp;&nbsp;"cached": <tspan fill="#38bdf8">true</tspan>,</text>
      <text y="74" fill="#c7d2fe">&nbsp;&nbsp;"latency_ms": <tspan fill="#f59e0b">18.4</tspan>,</text>
      <text y="88" fill="#c7d2fe">&nbsp;&nbsp;"payload": [</text>
      <text y="102" fill="#94a3b8">&nbsp;&nbsp;&nbsp;&nbsp;{ "id": 1, "name": "App" }, ...</text>
      <text y="116" fill="#c7d2fe">&nbsp;&nbsp;]</text>
      <text y="130" fill="#64748b">}</text>
    </g>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(670, 427)">
    <rect x="0" y="0" width="105" height="16" rx="3" fill="#030712" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
    <text x="8" y="11" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="500">PROJECT PREVIEW</text>
  </g>
</svg>
