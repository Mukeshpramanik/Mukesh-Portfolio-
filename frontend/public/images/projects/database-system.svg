<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>

    <filter id="dbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#dbBg)" />

  <!-- Subtle Schema Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top App Navigation / Status Bar -->
  <rect x="25" y="20" width="750" height="46" rx="8" fill="#101d30" stroke="#1c3150" stroke-width="1.2" />
  <!-- Database Cylinder Icon -->
  <rect x="42" y="33" width="20" height="20" rx="5" fill="#0284c7" />
  <ellipse cx="52" cy="38" rx="6" ry="2.5" fill="#ffffff" />
  <path d="M46 38 L46 45 C46 47, 58 47, 58 45 L58 38" fill="none" stroke="#ffffff" stroke-width="1.4" />
  <text x="70" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Relational Database Engine &amp; Query Optimizer</text>
  <text x="360" y="47" fill="#64748b" font-family="sans-serif" font-size="11">ACID Transactions, Indexing &amp; Query Plans</text>

  <!-- Health Badges -->
  <g transform="translate(565, 30)">
    <rect x="0" y="0" width="90" height="26" rx="5" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
    <circle cx="12" cy="13" r="3.5" fill="#34d399" />
    <text x="22" y="17" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="600">CONNECTED</text>

    <rect x="100" y="0" width="98" height="26" rx="5" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" />
    <text x="110" y="17" fill="#c7d2fe" font-family="monospace" font-size="10">Hit: 99.4%</text>
  </g>

  <!-- LEFT PANEL: ER Relational Entity Schemas -->
  <g transform="translate(25, 78)">
    <rect width="450" height="348" rx="8" fill="#0a1424" stroke="#1c3150" stroke-width="1" />
    <text x="20" y="26" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Entity Relationship (ER) Data Model</text>

    <!-- Entity 1: users Table -->
    <g transform="translate(20, 50)">
      <rect width="180" height="120" rx="6" fill="#111f36" stroke="#253e66" stroke-width="1" />
      <rect x="0" y="0" width="180" height="26" rx="6" fill="#1e1b4b" />
      <rect x="0" y="20" width="180" height="6" fill="#1e1b4b" />
      <text x="12" y="18" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="700">users (Table)</text>

      <g transform="translate(12, 42)" font-family="monospace" font-size="9.5">
        <text y="0" fill="#f59e0b">PK</text><text x="25" y="0" fill="#ffffff">id: uuid</text>
        <text y="18" fill="#38bdf8">UQ</text><text x="25" y="18" fill="#cbd5e1">email: varchar</text>
        <text y="36" fill="#64748b">--</text><text x="25" y="36" fill="#cbd5e1">full_name: text</text>
        <text y="54" fill="#64748b">--</text><text x="25" y="54" fill="#cbd5e1">created_at: timestamp</text>
      </g>
    </g>

    <!-- Connector Line between users and orders -->
    <path d="M 200 110 L 250 110 L 250 210 L 200 210" stroke="#38bdf8" stroke-width="1.6" fill="none" />
    <circle cx="200" cy="110" r="3.5" fill="#38bdf8" />
    <circle cx="200" cy="210" r="3.5" fill="#38bdf8" />
    <text x="258" y="165" fill="#38bdf8" font-family="monospace" font-size="8.5">1 : N</text>

    <!-- Entity 2: orders Table -->
    <g transform="translate(20, 200)">
      <rect width="180" height="120" rx="6" fill="#111f36" stroke="#253e66" stroke-width="1" />
      <rect x="0" y="0" width="180" height="26" rx="6" fill="#082f49" />
      <rect x="0" y="20" width="180" height="6" fill="#082f49" />
      <text x="12" y="18" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="700">orders (Table)</text>

      <g transform="translate(12, 42)" font-family="monospace" font-size="9.5">
        <text y="0" fill="#f59e0b">PK</text><text x="25" y="0" fill="#ffffff">id: bigint</text>
        <text y="18" fill="#a855f7">FK</text><text x="25" y="18" fill="#c084fc">user_id: uuid</text>
        <text y="36" fill="#64748b">--</text><text x="25" y="36" fill="#cbd5e1">total_amount: numeric</text>
        <text y="54" fill="#64748b">--</text><text x="25" y="54" fill="#cbd5e1">status: varchar</text>
      </g>
    </g>

    <!-- Entity 3: products Table -->
    <g transform="translate(250, 110)">
      <rect width="180" height="120" rx="6" fill="#111f36" stroke="#253e66" stroke-width="1" />
      <rect x="0" y="0" width="180" height="26" rx="6" fill="#064e3b" />
      <rect x="0" y="20" width="180" height="6" fill="#064e3b" />
      <text x="12" y="18" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700">products (Table)</text>

      <g transform="translate(12, 42)" font-family="monospace" font-size="9.5">
        <text y="0" fill="#f59e0b">PK</text><text x="25" y="0" fill="#ffffff">id: bigint</text>
        <text y="18" fill="#38bdf8">UQ</text><text x="25" y="18" fill="#cbd5e1">sku: varchar</text>
        <text y="36" fill="#64748b">--</text><text x="25" y="36" fill="#cbd5e1">price: numeric</text>
        <text y="54" fill="#64748b">--</text><text x="25" y="54" fill="#cbd5e1">stock_qty: integer</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: EXPLAIN ANALYZE Execution Plan Output -->
  <g transform="translate(490, 78)">
    <rect width="285" height="348" rx="8" fill="#070e18" stroke="#1c3150" stroke-width="1" />
    <rect x="0" y="0" width="285" height="30" rx="8" fill="#101c2e" />
    <rect x="0" y="22" width="285" height="8" fill="#101c2e" />
    <text x="14" y="20" fill="#f8fafc" font-family="monospace" font-size="10.5" font-weight="600">EXPLAIN (ANALYZE, BUFFERS)</text>

    <!-- Query tree execution output -->
    <g transform="translate(14, 52)" font-family="monospace" font-size="9">
      <text y="0" fill="#38bdf8">Hash Join  (cost=1.24..14.80)</text>
      <text y="16" fill="#64748b">&nbsp;&nbsp;Hash Cond: (o.user_id = u.id)</text>
      <text y="32" fill="#a855f7">&nbsp;&nbsp;-&gt; Seq Scan on orders o</text>
      <text y="48" fill="#64748b">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Rows: 1,420 • Filter: active</text>
      <text y="64" fill="#10b981">&nbsp;&nbsp;-&gt; Hash  (cost=1.12..1.12)</text>
      <text y="80" fill="#34d399">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-&gt; Index Scan on users_email_idx</text>
      <text y="96" fill="#64748b">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Index Cond: (email = $1)</text>

      <line x1="0" y1="115" x2="255" y2="115" stroke="#1c3150" stroke-width="0.8" />

      <!-- Execution Performance Metrics -->
      <text y="136" fill="#e2e8f0" font-weight="700">EXECUTION STATS:</text>
      <text y="156" fill="#94a3b8">Planning Time: <tspan fill="#ffffff">0.082 ms</tspan></text>
      <text y="176" fill="#94a3b8">Execution Time: <tspan fill="#34d399" font-weight="700">0.045 ms</tspan></text>
      <text y="196" fill="#94a3b8">Buffer Shared Hit: <tspan fill="#38bdf8">14 pages (100%)</tspan></text>
      <text y="216" fill="#94a3b8">Index Scan Hit: <tspan fill="#34d399">1 row</tspan></text>

      <!-- Transaction Status Badge -->
      <rect x="0" y="240" width="255" height="34" rx="5" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="0.8" />
      <text x="12" y="261" fill="#a7f3d0" font-family="monospace" font-size="9.5" font-weight="600">ACID Transaction Committed</text>
    </g>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(670, 427)">
    <rect x="0" y="0" width="105" height="16" rx="3" fill="#030712" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
    <text x="8" y="11" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="500">PROJECT PREVIEW</text>
  </g>
</svg>
