<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18" />
      <stop offset="50%" stop-color="#11112b" />
      <stop offset="100%" stop-color="#070714" />
    </linearGradient>

    <!-- Curve Area Gradient -->
    <linearGradient id="lossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="accGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#aiBg)" />

  <!-- Subtle Math Matrix Grid -->
  <g opacity="0.07" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top App Navigation / Status Bar -->
  <rect x="25" y="20" width="750" height="46" rx="8" fill="#13132e" stroke="#25244d" stroke-width="1.2" />
  <!-- Brain / Neural Icon -->
  <rect x="42" y="33" width="20" height="20" rx="5" fill="#8b5cf6" />
  <circle cx="52" cy="43" r="3" fill="#ffffff" />
  <circle cx="47" cy="38" r="2" fill="#ffffff" />
  <circle cx="57" cy="40" r="2" fill="#ffffff" />
  <circle cx="48" cy="48" r="2" fill="#ffffff" />
  <circle cx="56" cy="47" r="2" fill="#ffffff" />
  <line x1="52" y1="43" x2="47" y2="38" stroke="#ffffff" stroke-width="1" />
  <line x1="52" y1="43" x2="57" y2="40" stroke="#ffffff" stroke-width="1" />
  <line x1="52" y1="43" x2="48" y2="48" stroke="#ffffff" stroke-width="1" />
  <line x1="52" y1="43" x2="56" y2="47" stroke="#ffffff" stroke-width="1" />

  <text x="70" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Deep Learning Neural Engine</text>
  <text x="280" y="47" fill="#7c7ca8" font-family="sans-serif" font-size="11">Architecture, Backpropagation &amp; Weights Optimization</text>

  <!-- Status Badges -->
  <g transform="translate(565, 30)">
    <rect x="0" y="0" width="90" height="26" rx="5" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
    <text x="10" y="17" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="600">CONVERGED</text>

    <rect x="100" y="0" width="98" height="26" rx="5" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" />
    <text x="110" y="17" fill="#c7d2fe" font-family="monospace" font-size="10">Acc: 96.8%</text>
  </g>

  <!-- LEFT PANEL: Neural Network Topology Diagram -->
  <g transform="translate(25, 78)">
    <rect width="430" height="348" rx="8" fill="#0f0f24" stroke="#25244d" stroke-width="1" />
    <text x="18" y="28" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Multi-Layer Topology Visualization</text>
    <text x="18" y="44" fill="#7c7ca8" font-family="sans-serif" font-size="10">Input Features (x) → Dense Hidden Layers → Softmax Classification</text>

    <!-- Synapses / Connections Background lines -->
    <g stroke="#3b3b6d" stroke-width="0.8" opacity="0.6">
      <!-- Input to H1 -->
      <line x1="70" y1="100" x2="160" y2="80" /><line x1="70" y1="100" x2="160" y2="130" /><line x1="70" y1="100" x2="160" y2="180" /><line x1="70" y1="100" x2="160" y2="230" /><line x1="70" y1="100" x2="160" y2="280" />
      <line x1="70" y1="160" x2="160" y2="80" /><line x1="70" y1="160" x2="160" y2="130" /><line x1="70" y1="160" x2="160" y2="180" /><line x1="70" y1="160" x2="160" y2="230" /><line x1="70" y1="160" x2="160" y2="280" />
      <line x1="70" y1="220" x2="160" y2="80" /><line x1="70" y1="220" x2="160" y2="130" /><line x1="70" y1="220" x2="160" y2="180" /><line x1="70" y1="220" x2="160" y2="230" /><line x1="70" y1="220" x2="160" y2="280" />
      <line x1="70" y1="280" x2="160" y2="80" /><line x1="70" y1="280" x2="160" y2="130" /><line x1="70" y1="280" x2="160" y2="180" /><line x1="70" y1="280" x2="160" y2="230" /><line x1="70" y1="280" x2="160" y2="280" />

      <!-- H1 to H2 -->
      <line x1="160" y1="80" x2="260" y2="100" /><line x1="160" y1="80" x2="260" y2="160" /><line x1="160" y1="80" x2="260" y2="220" /><line x1="160" y1="80" x2="260" y2="280" />
      <line x1="160" y1="130" x2="260" y2="100" /><line x1="160" y1="130" x2="260" y2="160" /><line x1="160" y1="130" x2="260" y2="220" /><line x1="160" y1="130" x2="260" y2="280" />
      <line x1="160" y1="180" x2="260" y2="100" /><line x1="160" y1="180" x2="260" y2="160" /><line x1="160" y1="180" x2="260" y2="220" /><line x1="160" y1="180" x2="260" y2="280" />
      <line x1="160" y1="230" x2="260" y2="100" /><line x1="160" y1="230" x2="260" y2="160" /><line x1="160" y1="230" x2="260" y2="220" /><line x1="160" y1="230" x2="260" y2="280" />
      <line x1="160" y1="280" x2="260" y2="100" /><line x1="160" y1="280" x2="260" y2="160" /><line x1="160" y1="280" x2="260" y2="220" /><line x1="160" y1="280" x2="260" y2="280" />

      <!-- H2 to Output -->
      <line x1="260" y1="100" x2="360" y2="140" /><line x1="260" y1="100" x2="360" y2="230" />
      <line x1="260" y1="160" x2="360" y2="140" /><line x1="260" y1="160" x2="360" y2="230" />
      <line x1="260" y1="220" x2="360" y2="140" /><line x1="260" y1="220" x2="360" y2="230" />
      <line x1="260" y1="280" x2="360" y2="140" /><line x1="260" y1="280" x2="360" y2="230" />
    </g>

    <!-- Glowing Active Signal Synapses -->
    <g stroke="#8b5cf6" stroke-width="1.6" opacity="0.9" filter="url(#aiGlow)">
      <line x1="70" y1="100" x2="160" y2="130" />
      <line x1="160" y1="130" x2="260" y2="160" />
      <line x1="260" y1="160" x2="360" y2="140" />
    </g>

    <!-- Layer 1 Nodes (Input: 4 nodes) -->
    <text x="70" y="70" text-anchor="middle" fill="#7c7ca8" font-family="monospace" font-size="9">INPUT</text>
    <circle cx="70" cy="100" r="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="70" y="103" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="8.5" font-weight="700">x₁</text>
    <circle cx="70" cy="160" r="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="70" y="163" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="8.5" font-weight="700">x₂</text>
    <circle cx="70" cy="220" r="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="70" y="223" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="8.5" font-weight="700">x₃</text>
    <circle cx="70" cy="280" r="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="70" y="283" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="8.5" font-weight="700">x₄</text>

    <!-- Layer 2 Nodes (Hidden 1: 5 nodes) -->
    <text x="160" y="60" text-anchor="middle" fill="#7c7ca8" font-family="monospace" font-size="9">DENSE 1</text>
    <circle cx="160" cy="80" r="9" fill="#2e1065" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="160" cy="130" r="10" fill="#6d28d9" stroke="#c084fc" stroke-width="2" filter="url(#aiGlow)" />
    <circle cx="160" cy="180" r="9" fill="#2e1065" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="160" cy="230" r="9" fill="#2e1065" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="160" cy="280" r="9" fill="#2e1065" stroke="#a855f7" stroke-width="1.8" />

    <!-- Layer 3 Nodes (Hidden 2: 4 nodes) -->
    <text x="260" y="70" text-anchor="middle" fill="#7c7ca8" font-family="monospace" font-size="9">DENSE 2</text>
    <circle cx="260" cy="100" r="9" fill="#082f49" stroke="#0284c7" stroke-width="1.8" />
    <circle cx="260" cy="160" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#aiGlow)" />
    <circle cx="260" cy="220" r="9" fill="#082f49" stroke="#0284c7" stroke-width="1.8" />
    <circle cx="260" cy="280" r="9" fill="#082f49" stroke="#0284c7" stroke-width="1.8" />

    <!-- Layer 4 Nodes (Output: 2 nodes) -->
    <text x="360" y="110" text-anchor="middle" fill="#7c7ca8" font-family="monospace" font-size="9">OUTPUT</text>
    <circle cx="360" cy="140" r="13" fill="#065f46" stroke="#10b981" stroke-width="2.2" filter="url(#aiGlow)" />
    <text x="360" y="144" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">ŷ₁</text>
    <circle cx="360" cy="230" r="11" fill="#1f2937" stroke="#4b5563" stroke-width="1.5" />
    <text x="360" y="233" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="8.5">ŷ₂</text>

    <!-- Bottom Topology Stats -->
    <g transform="translate(18, 315)">
      <text fill="#a5b4fc" font-family="monospace" font-size="9.5">Parameters: 1,248,320 • Dropout: 0.2 • ReLU</text>
    </g>
  </g>

  <!-- RIGHT TOP: Training Loss & Accuracy Convergence Curves -->
  <g transform="translate(470, 78)">
    <rect width="305" height="190" rx="8" fill="#0f0f24" stroke="#25244d" stroke-width="1" />
    <text x="16" y="24" fill="#f1f5f9" font-family="sans-serif" font-size="11.5" font-weight="600">Training &amp; Loss Convergence</text>

    <!-- Legend -->
    <g transform="translate(160, 16)">
      <circle cx="0" cy="5" r="3.5" fill="#8b5cf6" />
      <text x="8" y="8" fill="#c7d2fe" font-family="sans-serif" font-size="8.5">Loss (Cross-Entropy)</text>
      <circle cx="85" cy="5" r="3.5" fill="#06b6d4" />
      <text x="93" y="8" fill="#bae6fd" font-family="sans-serif" font-size="8.5">Accuracy</text>
    </g>

    <!-- Axes -->
    <g transform="translate(30, 48)">
      <line x1="0" y1="105" x2="250" y2="105" stroke="#333360" stroke-width="1" />
      <line x1="0" y1="5" x2="0" y2="105" stroke="#333360" stroke-width="1" />

      <!-- X-Axis Labels -->
      <text x="0" y="118" fill="#64648c" font-family="monospace" font-size="8">Ep 1</text>
      <text x="60" y="118" fill="#64648c" font-family="monospace" font-size="8">Ep 25</text>
      <text x="120" y="118" fill="#64648c" font-family="monospace" font-size="8">Ep 50</text>
      <text x="180" y="118" fill="#64648c" font-family="monospace" font-size="8">Ep 75</text>
      <text x="235" y="118" fill="#64648c" font-family="monospace" font-size="8">Ep 100</text>

      <!-- Loss Curve (Descending: 0.85 -> 0.08) -->
      <path d="M 0 15 C 30 50, 70 85, 120 94 C 170 99, 210 101, 245 102 L 245 105 L 0 105 Z" fill="url(#lossGrad)" />
      <path d="M 0 15 C 30 50, 70 85, 120 94 C 170 99, 210 101, 245 102" fill="none" stroke="#8b5cf6" stroke-width="2" />

      <!-- Accuracy Curve (Ascending: 52% -> 96.8%) -->
      <path d="M 0 90 C 30 55, 70 25, 120 18 C 170 12, 210 10, 245 8" fill="none" stroke="#06b6d4" stroke-width="2" />
      <circle cx="245" cy="8" r="3.5" fill="#38bdf8" />
      <text x="185" y="6" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="700">96.8%</text>
    </g>
  </g>

  <!-- RIGHT BOTTOM: Hyperparameters & Compute Engine -->
  <g transform="translate(470, 280)">
    <rect width="305" height="146" rx="8" fill="#0f0f24" stroke="#25244d" stroke-width="1" />
    <text x="16" y="24" fill="#f1f5f9" font-family="sans-serif" font-size="11.5" font-weight="600">Model Configuration</text>

    <g transform="translate(16, 40)" font-family="monospace" font-size="10">
      <!-- Row 1 -->
      <rect x="0" y="0" width="130" height="38" rx="5" fill="#181836" stroke="#2a2955" stroke-width="0.8" />
      <text x="10" y="16" fill="#7c7ca8" font-size="8.5">OPTIMIZER</text>
      <text x="10" y="30" fill="#ffffff" font-weight="600">Adam (lr=1e-3)</text>

      <rect x="142" y="0" width="130" height="38" rx="5" fill="#181836" stroke="#2a2955" stroke-width="0.8" />
      <text x="152" y="16" fill="#7c7ca8" font-size="8.5">BATCH SIZE</text>
      <text x="152" y="30" fill="#ffffff" font-weight="600">64 Samples</text>

      <!-- Row 2 -->
      <rect x="0" y="48" width="130" height="38" rx="5" fill="#181836" stroke="#2a2955" stroke-width="0.8" />
      <text x="10" y="64" fill="#7c7ca8" font-size="8.5">PRECISION</text>
      <text x="10" y="78" fill="#10b981" font-weight="600">FP32 Tensor</text>

      <rect x="142" y="48" width="130" height="38" rx="5" fill="#181836" stroke="#2a2955" stroke-width="0.8" />
      <text x="152" y="64" fill="#7c7ca8" font-size="8.5">DEVICE</text>
      <text x="152" y="78" fill="#38bdf8" font-weight="600">CUDA / GPU</text>
    </g>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(670, 427)">
    <rect x="0" y="0" width="105" height="16" rx="3" fill="#030712" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
    <text x="8" y="11" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="500">PROJECT PREVIEW</text>
  </g>
</svg>
