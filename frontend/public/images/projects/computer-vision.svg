<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <filter id="cvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#cvBg)" />

  <!-- Subtle Camera Viewfinder Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top App Navigation / Status Bar -->
  <rect x="25" y="20" width="750" height="46" rx="8" fill="#111c33" stroke="#1f3358" stroke-width="1.2" />
  <!-- Vision Sensor Icon -->
  <rect x="42" y="33" width="20" height="20" rx="5" fill="#0284c7" />
  <circle cx="52" cy="43" r="6" stroke="#ffffff" stroke-width="1.6" fill="none" />
  <circle cx="52" cy="43" r="2.5" fill="#ffffff" />
  <text x="70" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Computer Vision &amp; Real-Time Perception Lab</text>
  <text x="350" y="47" fill="#64748b" font-family="sans-serif" font-size="11">YOLO Convolutional Detection &amp; Spatial Tracking</text>

  <!-- Real-time Inference Badges -->
  <g transform="translate(565, 30)">
    <rect x="0" y="0" width="85" height="26" rx="5" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
    <circle cx="12" cy="13" r="3.5" fill="#34d399" />
    <text x="22" y="17" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="600">68 FPS</text>

    <rect x="95" y="0" width="100" height="26" rx="5" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" />
    <text x="105" y="17" fill="#c7d2fe" font-family="monospace" font-size="10">Lat: 14.6ms</text>
  </g>

  <!-- LEFT PANEL: Viewfinder Frame with Object Bounding Boxes -->
  <g transform="translate(25, 78)">
    <rect width="470" height="348" rx="8" fill="#091222" stroke="#1f3358" stroke-width="1" />
    <!-- Viewfinder Corner Crosshairs -->
    <path d="M 15 25 L 15 15 L 25 15" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 455 25 L 455 15 L 445 15" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 15 323 L 15 333 L 25 333" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 455 323 L 455 333 L 445 333" stroke="#38bdf8" stroke-width="2" fill="none" />

    <!-- Center Reticle -->
    <circle cx="235" cy="174" r="16" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3" fill="none" />
    <line x1="235" y1="154" x2="235" y2="194" stroke="#0284c7" stroke-width="1" />
    <line x1="215" y1="174" x2="255" y2="174" stroke="#0284c7" stroke-width="1" />

    <!-- Bounding Box 1: Person (Cyan) -->
    <g transform="translate(50, 60)">
      <rect width="160" height="240" rx="4" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="2" filter="url(#cvGlow)" />
      <!-- Label Tag -->
      <rect x="0" y="-22" width="115" height="22" rx="3" fill="#06b6d4" />
      <text x="8" y="-7" fill="#042f2e" font-family="monospace" font-size="10.5" font-weight="700">PERSON: 98.4%</text>
      <!-- Keypoint skeleton dots -->
      <circle cx="80" cy="50" r="5" fill="#38bdf8" />
      <circle cx="80" cy="110" r="4" fill="#38bdf8" />
      <circle cx="45" cy="110" r="4" fill="#38bdf8" />
      <circle cx="115" cy="110" r="4" fill="#38bdf8" />
      <line x1="80" y1="50" x2="80" y2="110" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="45" y1="110" x2="115" y2="110" stroke="#38bdf8" stroke-width="1.5" />
    </g>

    <!-- Bounding Box 2: Laptop (Violet) -->
    <g transform="translate(245, 130)">
      <rect width="175" height="150" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="2" />
      <rect x="0" y="-22" width="115" height="22" rx="3" fill="#8b5cf6" />
      <text x="8" y="-7" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700">LAPTOP: 96.2%</text>
      <!-- Screen outline representation -->
      <rect x="20" y="20" width="135" height="85" rx="3" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <rect x="15" y="108" width="145" height="15" rx="2" fill="#312e81" />
    </g>
  </g>

  <!-- RIGHT TOP: Convolutional Feature Activation Map -->
  <g transform="translate(510, 78)">
    <rect width="265" height="165" rx="8" fill="#091222" stroke="#1f3358" stroke-width="1" />
    <text x="16" y="24" fill="#f1f5f9" font-family="sans-serif" font-size="11.5" font-weight="600">Feature Heatmap (Conv2D)</text>
    <text x="16" y="38" fill="#64748b" font-family="sans-serif" font-size="9.5">Channel 48 / 128 Activation</text>

    <!-- Heatmap Tensor Grid (6x4) -->
    <g transform="translate(16, 52)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="34" height="22" rx="2" fill="#082f49" />
      <rect x="38" y="0" width="34" height="22" rx="2" fill="#0369a1" />
      <rect x="76" y="0" width="34" height="22" rx="2" fill="#0284c7" />
      <rect x="114" y="0" width="34" height="22" rx="2" fill="#38bdf8" />
      <rect x="152" y="0" width="34" height="22" rx="2" fill="#0284c7" />
      <rect x="190" y="0" width="34" height="22" rx="2" fill="#0369a1" />

      <!-- Row 2 -->
      <rect x="0" y="26" width="34" height="22" rx="2" fill="#0369a1" />
      <rect x="38" y="26" width="34" height="22" rx="2" fill="#6366f1" />
      <rect x="76" y="26" width="34" height="22" rx="2" fill="#a855f7" />
      <rect x="114" y="26" width="34" height="22" rx="2" fill="#ec4899" filter="url(#cvGlow)" />
      <rect x="152" y="26" width="34" height="22" rx="2" fill="#a855f7" />
      <rect x="190" y="26" width="34" height="22" rx="2" fill="#0369a1" />

      <!-- Row 3 -->
      <rect x="0" y="52" width="34" height="22" rx="2" fill="#082f49" />
      <rect x="38" y="52" width="34" height="22" rx="2" fill="#0369a1" />
      <rect x="76" y="52" width="34" height="22" rx="2" fill="#6366f1" />
      <rect x="114" y="52" width="34" height="22" rx="2" fill="#a855f7" />
      <rect x="152" y="52" width="34" height="22" rx="2" fill="#0369a1" />
      <rect x="190" y="52" width="34" height="22" rx="2" fill="#082f49" />

      <!-- Row 4 -->
      <rect x="0" y="78" width="34" height="22" rx="2" fill="#020617" />
      <rect x="38" y="78" width="34" height="22" rx="2" fill="#082f49" />
      <rect x="76" y="78" width="34" height="22" rx="2" fill="#082f49" />
      <rect x="114" y="78" width="34" height="22" rx="2" fill="#0369a1" />
      <rect x="152" y="78" width="34" height="22" rx="2" fill="#082f49" />
      <rect x="190" y="78" width="34" height="22" rx="2" fill="#020617" />
    </g>
  </g>

  <!-- RIGHT BOTTOM: Model Specifications -->
  <g transform="translate(510, 258)">
    <rect width="265" height="168" rx="8" fill="#091222" stroke="#1f3358" stroke-width="1" />
    <text x="16" y="24" fill="#f1f5f9" font-family="sans-serif" font-size="11.5" font-weight="600">Perception Engine Specs</text>

    <g transform="translate(16, 44)" font-family="monospace" font-size="9.5">
      <text y="0" fill="#94a3b8">Backbone: <tspan fill="#ffffff" font-weight="700">CSPDarknet53</tspan></text>
      <text y="24" fill="#94a3b8">Resolution: <tspan fill="#ffffff" font-weight="700">640 × 640 px</tspan></text>
      <text y="48" fill="#94a3b8">mAP@0.5: <tspan fill="#34d399" font-weight="700">54.8% COCO</tspan></text>
      <text y="72" fill="#94a3b8">Framework: <tspan fill="#38bdf8" font-weight="700">PyTorch / ONNX</tspan></text>
      <text y="96" fill="#94a3b8">Optimization: <tspan fill="#a855f7" font-weight="700">TensorRT FP16</tspan></text>
    </g>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(670, 427)">
    <rect x="0" y="0" width="105" height="16" rx="3" fill="#030712" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
    <text x="8" y="11" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="500">PROJECT PREVIEW</text>
  </g>
</svg>
