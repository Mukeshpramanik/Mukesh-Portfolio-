<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="scrapeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1e" />
      <stop offset="50%" stop-color="#0d142b" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Chrome Header Gradient -->
    <linearGradient id="scrapeTopBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121a36" />
      <stop offset="100%" stop-color="#1b254d" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="scrapeCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c3b" />
      <stop offset="100%" stop-color="#0d1329" />
    </linearGradient>

    <!-- Terminal Background -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#070a17" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="emeraldCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#scrapeBg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="100" r="150" fill="#10b981" opacity="0.10" filter="url(#softGlow)" />
  <circle cx="680" cy="360" r="160" fill="#06b6d4" opacity="0.10" filter="url(#softGlow)" />

  <!-- Main Window Frame -->
  <rect x="18" y="14" width="764" height="422" rx="12" fill="#0d132b" stroke="#232f57" stroke-width="1.2" filter="url(#windowShadow)" />

  <!-- Window Header Bar -->
  <rect x="18" y="14" width="764" height="46" rx="12" fill="url(#scrapeTopBar)" />
  <rect x="18" y="48" width="764" height="12" fill="url(#scrapeTopBar)" />
  <line x1="18" y1="60" x2="782" y2="60" stroke="#232f57" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="38" cy="37" r="4.5" fill="#ef4444" />
  <circle cx="53" cy="37" r="4.5" fill="#f59e0b" />
  <circle cx="68" cy="37" r="4.5" fill="#10b981" />

  <!-- App Title & Icon -->
  <g transform="translate(90, 27)">
    <rect width="22" height="20" rx="5" fill="url(#emeraldCyanGrad)" />
    <!-- Web scraping spider / bracket icon -->
    <path d="M5 9 L8 12 L5 15 M17 9 L14 12 L17 15 M11 6 L11 18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="28" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.5">SCRAPEX CORE</text>
    <text x="132" y="15" fill="#34d399" font-family="sans-serif" font-size="9.5" font-weight="600">ETL PIPELINE</text>
  </g>

  <!-- Status Badges (Top Right) -->
  <g transform="translate(485, 25)">
    <rect width="135" height="25" rx="6" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
    <circle cx="12" cy="12.5" r="3.5" fill="#34d399" />
    <text x="22" y="16" fill="#a7f3d0" font-family="monospace" font-size="9.5" font-weight="600">4 WORKERS • ACTIVE</text>

    <rect x="145" y="0" width="135" height="25" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8" />
    <text x="155" y="16" fill="#c7d2fe" font-family="monospace" font-size="9.5">2,450 req / min</text>
  </g>

  <!-- TOP PIPELINE FLOW STRIP -->
  <g transform="translate(32, 70)">
    <rect width="736" height="54" rx="8" fill="url(#scrapeCardBg)" stroke="#222f56" stroke-width="1" />
    
    <!-- Stage 1: Crawler -->
    <g transform="translate(18, 12)">
      <rect width="150" height="30" rx="6" fill="#0b1024" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="15" r="3.5" fill="#34d399" />
      <text x="25" y="19" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">1. Spider / Crawl</text>
      <text x="110" y="19" fill="#34d399" font-family="monospace" font-size="9">200 OK</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="174" y1="27" x2="198" y2="27" stroke="#34d399" stroke-width="1.6" stroke-dasharray="3,2" />
    <polygon points="202,27 196,24 196,30" fill="#34d399" />

    <!-- Stage 2: DOM Parsing -->
    <g transform="translate(208, 12)">
      <rect width="150" height="30" rx="6" fill="#0b1024" stroke="#06b6d4" stroke-width="1" />
      <circle cx="14" cy="15" r="3.5" fill="#38bdf8" />
      <text x="25" y="19" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">2. XPath / Selector</text>
      <text x="122" y="19" fill="#38bdf8" font-family="monospace" font-size="9">DOM</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="364" y1="27" x2="388" y2="27" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="3,2" />
    <polygon points="392,27 386,24 386,30" fill="#38bdf8" />

    <!-- Stage 3: Data Sanitization -->
    <g transform="translate(398, 12)">
      <rect width="150" height="30" rx="6" fill="#0b1024" stroke="#8b5cf6" stroke-width="1" />
      <circle cx="14" cy="15" r="3.5" fill="#a855f7" />
      <text x="25" y="19" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">3. Clean &amp; Dedupe</text>
      <text x="118" y="19" fill="#c084fc" font-family="monospace" font-size="9">MD5</text>
    </g>

    <!-- Arrow 3 -->
    <line x1="554" y1="27" x2="578" y2="27" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="3,2" />
    <polygon points="582,27 576,24 576,30" fill="#8b5cf6" />

    <!-- Stage 4: DB Export -->
    <g transform="translate(588, 12)">
      <rect width="134" height="30" rx="6" fill="#0b1024" stroke="#f59e0b" stroke-width="1" />
      <circle cx="14" cy="15" r="3.5" fill="#fbbf24" />
      <text x="25" y="19" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">4. DB Ingestion</text>
      <text x="105" y="19" fill="#fde68a" font-family="monospace" font-size="9">SYNC</text>
    </g>
  </g>

  <!-- MAIN SECTION: TWO PANELS -->

  <!-- LEFT: Real-time Terminal Execution Console -->
  <g transform="translate(32, 134)">
    <rect width="360" height="290" rx="8" fill="url(#termBg)" stroke="#222f56" stroke-width="1" />
    
    <!-- Terminal Titlebar -->
    <rect width="360" height="28" rx="8" fill="#121933" />
    <rect y="20" width="360" height="8" fill="#121933" />
    <circle cx="16" cy="14" r="3.5" fill="#ef4444" />
    <circle cx="28" cy="14" r="3.5" fill="#f59e0b" />
    <circle cx="40" cy="14" r="3.5" fill="#10b981" />
    <text x="60" y="18" fill="#94a3b8" font-family="monospace" font-size="10">scraper_daemon.py — terminal</text>

    <!-- Console Log Lines -->
    <g transform="translate(14, 46)" font-family="monospace" font-size="9.5">
      <!-- Command -->
      <text y="0" fill="#64748b">$ python3 -m pipeline.worker --concurrency=4</text>
      
      <!-- Log 1 -->
      <text y="20" fill="#38bdf8">[23:42:01]</text>
      <text x="70" y="20" fill="#a855f7">[INIT]</text>
      <text x="110" y="20" fill="#cbd5e1">Spinning Chromium pool (x4)</text>

      <!-- Log 2 -->
      <text y="40" fill="#38bdf8">[23:42:02]</text>
      <text x="70" y="40" fill="#10b981">[PROXY]</text>
      <text x="115" y="40" fill="#cbd5e1">Rotating proxy node connected</text>

      <!-- Log 3 -->
      <text y="60" fill="#38bdf8">[23:42:03]</text>
      <text x="70" y="60" fill="#10b981">[200 OK]</text>
      <text x="120" y="60" fill="#e2e8f0">GET /products?page=1..4</text>

      <!-- Log 4 -->
      <text y="80" fill="#38bdf8">[23:42:04]</text>
      <text x="70" y="80" fill="#f59e0b">[XPATH]</text>
      <text x="118" y="80" fill="#cbd5e1">Parsed 120 product nodes</text>

      <!-- Log 5 -->
      <text y="100" fill="#38bdf8">[23:42:05]</text>
      <text x="70" y="100" fill="#06b6d4">[CLEAN]</text>
      <text x="118" y="100" fill="#cbd5e1">Sanitized prices &amp; normalized</text>

      <!-- Log 6 -->
      <text y="120" fill="#38bdf8">[23:42:06]</text>
      <text x="70" y="120" fill="#10b981">[DEDUPE]</text>
      <text x="122" y="120" fill="#cbd5e1">MD5 hash validation (0 collisions)</text>

      <!-- Log 7 -->
      <text y="140" fill="#38bdf8">[23:42:07]</text>
      <text x="70" y="140" fill="#10b981">[SYNC]</text>
      <text x="110" y="140" fill="#a7f3d0">Committed 120 rows to PostgreSQL</text>

      <!-- Log 8 -->
      <text y="160" fill="#38bdf8">[23:42:09]</text>
      <text x="70" y="160" fill="#10b981">[200 OK]</text>
      <text x="120" y="160" fill="#e2e8f0">GET /products?page=5..8</text>

      <!-- Log 9 -->
      <text y="180" fill="#38bdf8">[23:42:10]</text>
      <text x="70" y="180" fill="#a855f7">[BUFFER]</text>
      <text x="122" y="180" fill="#cbd5e1">Queue size: 24 remaining</text>

      <!-- Cursor -->
      <rect x="0" y="196" width="7" height="13" fill="#34d399" />
      <text x="12" y="206" fill="#34d399">worker streaming realtime events...</text>
    </g>
  </g>

  <!-- RIGHT: Structured Scraped Records Table Preview -->
  <g transform="translate(406, 134)">
    <rect width="362" height="290" rx="8" fill="url(#scrapeCardBg)" stroke="#222f56" stroke-width="1" />
    
    <!-- Table Header Title -->
    <text x="16" y="22" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Parsed Schema Preview (Live Stream)</text>
    <text x="16" y="35" fill="#64748b" font-family="sans-serif" font-size="9">Structured JSON data emitted to target storage</text>

    <!-- Table Columns Header -->
    <g transform="translate(16, 48)">
      <rect width="330" height="22" rx="4" fill="#0b1024" />
      <text x="8" y="15" fill="#94a3b8" font-family="monospace" font-size="8.5" font-weight="700">SKU / ID</text>
      <text x="72" y="15" fill="#94a3b8" font-family="monospace" font-size="8.5" font-weight="700">ITEM TITLE</text>
      <text x="195" y="15" fill="#94a3b8" font-family="monospace" font-size="8.5" font-weight="700">PRICE</text>
      <text x="250" y="15" fill="#94a3b8" font-family="monospace" font-size="8.5" font-weight="700">STATUS</text>
    </g>

    <!-- Table Rows -->
    <g transform="translate(16, 76)">
      <!-- Row 1 -->
      <rect width="330" height="30" rx="4" fill="#0e1530" />
      <text x="8" y="19" fill="#818cf8" font-family="monospace" font-size="8.5">#SKU-9021</text>
      <text x="72" y="19" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="600">Sony WH-1000XM5</text>
      <text x="195" y="19" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">$398.00</text>
      <rect x="250" y="8" width="54" height="15" rx="3" fill="#064e3b" />
      <text x="277" y="18.5" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="7.5" font-weight="700">PARSED</text>

      <!-- Row 2 -->
      <g transform="translate(0, 34)">
        <rect width="330" height="30" rx="4" fill="#0b1024" />
        <text x="8" y="19" fill="#818cf8" font-family="monospace" font-size="8.5">#SKU-8842</text>
        <text x="72" y="19" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="600">MacBook Pro M3 Max</text>
        <text x="195" y="19" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">$3,199.00</text>
        <rect x="250" y="8" width="54" height="15" rx="3" fill="#064e3b" />
        <text x="277" y="18.5" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="7.5" font-weight="700">PARSED</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 68)">
        <rect width="330" height="30" rx="4" fill="#0e1530" />
        <text x="8" y="19" fill="#818cf8" font-family="monospace" font-size="8.5">#SKU-7731</text>
        <text x="72" y="19" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="600">Keychron Q1 Pro RGB</text>
        <text x="195" y="19" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">$199.00</text>
        <rect x="250" y="8" width="54" height="15" rx="3" fill="#064e3b" />
        <text x="277" y="18.5" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="7.5" font-weight="700">PARSED</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 102)">
        <rect width="330" height="30" rx="4" fill="#0b1024" />
        <text x="8" y="19" fill="#818cf8" font-family="monospace" font-size="8.5">#SKU-6520</text>
        <text x="72" y="19" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="600">Dell UltraSharp 27" 4K</text>
        <text x="195" y="19" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">$579.00</text>
        <rect x="250" y="8" width="54" height="15" rx="3" fill="#1e1b4b" />
        <text x="277" y="18.5" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="7.5" font-weight="700">QUEUED</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 136)">
        <rect width="330" height="30" rx="4" fill="#0e1530" />
        <text x="8" y="19" fill="#818cf8" font-family="monospace" font-size="8.5">#SKU-5411</text>
        <text x="72" y="19" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="600">Logitech MX Master 3S</text>
        <text x="195" y="19" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">$99.00</text>
        <rect x="250" y="8" width="54" height="15" rx="3" fill="#064e3b" />
        <text x="277" y="18.5" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="7.5" font-weight="700">PARSED</text>
      </g>
    </g>

    <!-- Metrics Summary Card in Table Footer -->
    <g transform="translate(16, 248)">
      <rect width="330" height="26" rx="4" fill="#0b1024" stroke="#222f56" stroke-width="0.8" />
      <text x="10" y="16.5" fill="#34d399" font-family="monospace" font-size="8.5" font-weight="700">Records: 12,480</text>
      <text x="120" y="16.5" fill="#cbd5e1" font-family="monospace" font-size="8.5">Latency: 120ms</text>
      <text x="235" y="16.5" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="700">Success: 99.8%</text>
    </g>
  </g>
</svg>
