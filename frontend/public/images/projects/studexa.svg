<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="studexaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1022" />
      <stop offset="50%" stop-color="#111736" />
      <stop offset="100%" stop-color="#090d1c" />
    </linearGradient>

    <!-- Chrome / Header Gradients -->
    <linearGradient id="studexaTopBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161e3d" />
      <stop offset="100%" stop-color="#1c264e" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182042" />
      <stop offset="100%" stop-color="#121833" />
    </linearGradient>

    <!-- Glows & Accents -->
    <linearGradient id="violetCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#studexaBg)" />

  <!-- Subtle Perspective Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="700" cy="380" r="160" fill="#06b6d4" opacity="0.10" filter="url(#softGlow)" />

  <!-- Main Window Frame -->
  <rect x="18" y="14" width="764" height="422" rx="12" fill="#0e142c" stroke="#253158" stroke-width="1.2" filter="url(#cardShadow)" />

  <!-- Window Header Bar -->
  <rect x="18" y="14" width="764" height="46" rx="12" fill="url(#studexaTopBar)" />
  <rect x="18" y="48" width="764" height="12" fill="url(#studexaTopBar)" />
  <line x1="18" y1="60" x2="782" y2="60" stroke="#253158" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="38" cy="37" r="4.5" fill="#ef4444" />
  <circle cx="53" cy="37" r="4.5" fill="#f59e0b" />
  <circle cx="68" cy="37" r="4.5" fill="#10b981" />

  <!-- Studexa Brand Logo -->
  <g transform="translate(90, 27)">
    <rect width="22" height="20" rx="5" fill="url(#violetCyanGrad)" />
    <path d="M5 14 L11 6 L17 14 M7 11 L15 11" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="28" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">STUDEXA</text>
    <text x="88" y="15" fill="#818cf8" font-family="sans-serif" font-size="10" font-weight="600">ACADEMICS</text>
  </g>

  <!-- Global Search Bar -->
  <g transform="translate(290, 25)">
    <rect width="270" height="25" rx="6" fill="#0a0f22" stroke="#273561" stroke-width="0.8" />
    <circle cx="14" cy="12.5" r="4" stroke="#64748b" stroke-width="1.2" fill="none" />
    <line x1="17" y1="15.5" x2="21" y2="19.5" stroke="#64748b" stroke-width="1.2" />
    <text x="28" y="16" fill="#64748b" font-family="sans-serif" font-size="10">Search student name, ID, or course...</text>
  </g>

  <!-- Top Right Header Badges -->
  <g transform="translate(585, 25)">
    <!-- Term Badge -->
    <rect width="105" height="25" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="0.8" />
    <circle cx="12" cy="12.5" r="3" fill="#38bdf8" />
    <text x="22" y="16" fill="#c7d2fe" font-family="sans-serif" font-size="9.5" font-weight="600">Spring Term 2025</text>

    <!-- User Profile Avatar -->
    <circle cx="132" cy="12.5" r="12" fill="#312e81" stroke="#818cf8" stroke-width="1" />
    <text x="132" y="16" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">AD</text>
  </g>

  <!-- Left Sidebar Navigation -->
  <rect x="18" y="60" width="145" height="376" fill="#0c1126" />
  <line x1="163" y1="60" x2="163" y2="436" stroke="#253158" stroke-width="1" />

  <!-- Sidebar Nav Items -->
  <g transform="translate(28, 76)">
    <!-- Active Nav: Students -->
    <rect width="125" height="30" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="15" r="3.5" fill="#a855f7" />
    <text x="26" y="19" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700">Students (2.8k)</text>

    <!-- Nav 2: Courses -->
    <g transform="translate(0, 38)">
      <circle cx="14" cy="15" r="3.5" fill="#64748b" />
      <text x="26" y="19" fill="#94a3b8" font-family="sans-serif" font-size="10.5" font-weight="500">Course Catalog</text>
    </g>

    <!-- Nav 3: Attendance -->
    <g transform="translate(0, 76)">
      <circle cx="14" cy="15" r="3.5" fill="#64748b" />
      <text x="26" y="19" fill="#94a3b8" font-family="sans-serif" font-size="10.5" font-weight="500">Attendance Log</text>
    </g>

    <!-- Nav 4: Exam & GPA -->
    <g transform="translate(0, 114)">
      <circle cx="14" cy="15" r="3.5" fill="#64748b" />
      <text x="26" y="19" fill="#94a3b8" font-family="sans-serif" font-size="10.5" font-weight="500">Grades &amp; GPA</text>
    </g>

    <!-- Nav 5: SQL Exporter -->
    <g transform="translate(0, 152)">
      <circle cx="14" cy="15" r="3.5" fill="#64748b" />
      <text x="26" y="19" fill="#94a3b8" font-family="sans-serif" font-size="10.5" font-weight="500">Data Export (CSV)</text>
    </g>
  </g>

  <!-- Database Connection Indicator in Sidebar Bottom -->
  <g transform="translate(28, 380)">
    <rect width="125" height="34" rx="6" fill="#081024" stroke="#1f2d54" stroke-width="0.8" />
    <circle cx="14" cy="17" r="3.5" fill="#10b981" />
    <text x="25" y="15" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="600">SQLite Database</text>
    <text x="25" y="27" fill="#34d399" font-family="monospace" font-size="8">Connected • 12ms</text>
  </g>

  <!-- MAIN DASHBOARD CONTENT AREA -->
  <!-- Top 3 Stat Cards Row -->
  <g transform="translate(178, 72)">
    <!-- Stat 1: Total Enrollment -->
    <rect x="0" y="0" width="188" height="66" rx="8" fill="url(#cardBg)" stroke="#273561" stroke-width="1" />
    <text x="14" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">TOTAL ACTIVE ENROLLMENT</text>
    <text x="14" y="46" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">2,842</text>
    <rect x="122" y="28" width="54" height="20" rx="4" fill="#065f46" fill-opacity="0.5" stroke="#059669" stroke-width="0.8" />
    <text x="128" y="42" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">+8.4% ↑</text>

    <!-- Stat 2: Average Academic GPA -->
    <rect x="200" y="0" width="188" height="66" rx="8" fill="url(#cardBg)" stroke="#273561" stroke-width="1" />
    <text x="14" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">CUMULATIVE AVERAGE GPA</text>
    <text x="14" y="46" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">3.78</text>
    <rect x="118" y="28" width="58" height="20" rx="4" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="0.8" />
    <text x="124" y="42" fill="#c7d2fe" font-family="sans-serif" font-size="9" font-weight="700">HONORS</text>

    <!-- Stat 3: Average Attendance -->
    <rect x="400" y="0" width="190" height="66" rx="8" fill="url(#cardBg)" stroke="#273561" stroke-width="1" />
    <text x="14" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">ATTENDANCE COMPLIANCE</text>
    <text x="14" y="46" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">96.4%</text>
    <rect x="126" y="28" width="52" height="20" rx="4" fill="#082f49" fill-opacity="0.6" stroke="#0284c7" stroke-width="0.8" />
    <text x="132" y="42" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700">OPTIMAL</text>
  </g>

  <!-- Main Student Records Data Table Card -->
  <g transform="translate(178, 148)">
    <rect width="590" height="272" rx="8" fill="url(#cardBg)" stroke="#273561" stroke-width="1" />

    <!-- Table Action Header Bar -->
    <text x="16" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Student Directory &amp; Academic Profiles</text>

    <!-- Action Buttons -->
    <g transform="translate(435, 12)">
      <rect width="66" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="600">Filter ▼</text>

      <rect x="74" y="0" width="68" height="22" rx="5" fill="url(#cyanBlueGrad)" />
      <text x="83" y="15" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">+ Add Student</text>
    </g>

    <!-- Table Header Row -->
    <g transform="translate(16, 42)">
      <rect width="558" height="24" rx="4" fill="#10162e" />
      <text x="10" y="16" fill="#818cf8" font-family="sans-serif" font-size="9" font-weight="700">STUDENT NAME</text>
      <text x="150" y="16" fill="#818cf8" font-family="sans-serif" font-size="9" font-weight="700">STUDENT ID</text>
      <text x="250" y="16" fill="#818cf8" font-family="sans-serif" font-size="9" font-weight="700">DEGREE PROGRAM</text>
      <text x="390" y="16" fill="#818cf8" font-family="sans-serif" font-size="9" font-weight="700">GPA</text>
      <text x="460" y="16" fill="#818cf8" font-family="sans-serif" font-size="9" font-weight="700">STATUS</text>

      <!-- Row 1: Aarav Sharma -->
      <g transform="translate(0, 32)">
        <!-- Avatar circle -->
        <circle cx="18" cy="11" r="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.8" />
        <text x="18" y="14" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="8.5" font-weight="700">AS</text>
        <text x="35" y="15" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">Aarav Sharma</text>
        <text x="150" y="15" fill="#94a3b8" font-family="monospace" font-size="9.5">#STU-2024-001</text>
        <text x="250" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="10">Computer Science (CSE)</text>
        <text x="390" y="15" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">3.92</text>
        <rect x="458" y="4" width="58" height="18" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
        <text x="468" y="16" fill="#34d399" font-family="sans-serif" font-size="8.5" font-weight="700">ACTIVE</text>
      </g>

      <!-- Row 2: Priya Patel -->
      <g transform="translate(0, 72)">
        <line x1="0" y1="-8" x2="558" y2="-8" stroke="#1e2746" stroke-width="0.8" />
        <circle cx="18" cy="11" r="10" fill="#2e1065" stroke="#c084fc" stroke-width="0.8" />
        <text x="18" y="14" text-anchor="middle" fill="#f3e8ff" font-family="sans-serif" font-size="8.5" font-weight="700">PP</text>
        <text x="35" y="15" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">Priya Patel</text>
        <text x="150" y="15" fill="#94a3b8" font-family="monospace" font-size="9.5">#STU-2024-042</text>
        <text x="250" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="10">Data Analytics &amp; AI</text>
        <text x="390" y="15" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">3.88</text>
        <rect x="458" y="4" width="58" height="18" rx="4" fill="#2e1065" fill-opacity="0.6" stroke="#a855f7" stroke-width="0.8" />
        <text x="466" y="16" fill="#d8b4fe" font-family="sans-serif" font-size="8.5" font-weight="700">HONORS</text>
      </g>

      <!-- Row 3: Rohan Mehta -->
      <g transform="translate(0, 112)">
        <line x1="0" y1="-8" x2="558" y2="-8" stroke="#1e2746" stroke-width="0.8" />
        <circle cx="18" cy="11" r="10" fill="#082f49" stroke="#38bdf8" stroke-width="0.8" />
        <text x="18" y="14" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="8.5" font-weight="700">RM</text>
        <text x="35" y="15" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">Rohan Mehta</text>
        <text x="150" y="15" fill="#94a3b8" font-family="monospace" font-size="9.5">#STU-2023-118</text>
        <text x="250" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="10">Software Engineering</text>
        <text x="390" y="15" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">3.74</text>
        <rect x="458" y="4" width="58" height="18" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
        <text x="468" y="16" fill="#34d399" font-family="sans-serif" font-size="8.5" font-weight="700">ACTIVE</text>
      </g>

      <!-- Row 4: Ananya Iyer -->
      <g transform="translate(0, 152)">
        <line x1="0" y1="-8" x2="558" y2="-8" stroke="#1e2746" stroke-width="0.8" />
        <circle cx="18" cy="11" r="10" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
        <text x="18" y="14" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="8.5" font-weight="700">AI</text>
        <text x="35" y="15" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">Ananya Iyer</text>
        <text x="150" y="15" fill="#94a3b8" font-family="monospace" font-size="9.5">#STU-2024-089</text>
        <text x="250" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="10">Artificial Intelligence</text>
        <text x="390" y="15" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">3.96</text>
        <rect x="458" y="4" width="70" height="18" rx="4" fill="#451a03" fill-opacity="0.7" stroke="#f59e0b" stroke-width="0.8" />
        <text x="463" y="16" fill="#fde68a" font-family="sans-serif" font-size="8.5" font-weight="700">DEAN'S LIST</text>
      </g>
    </g>

    <!-- Table Pagination Footer -->
    <g transform="translate(16, 240)">
      <text x="0" y="16" fill="#64748b" font-family="sans-serif" font-size="9.5">Showing 1 to 4 of 2,842 student profiles</text>
      <rect x="450" y="2" width="26" height="20" rx="4" fill="#10162e" stroke="#253158" stroke-width="0.8" />
      <text x="459" y="15" fill="#94a3b8" font-family="monospace" font-size="9">1</text>
      <rect x="480" y="2" width="26" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
      <text x="489" y="15" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700">2</text>
      <rect x="510" y="2" width="26" height="20" rx="4" fill="#10162e" stroke="#253158" stroke-width="0.8" />
      <text x="519" y="15" fill="#94a3b8" font-family="monospace" font-size="9">3</text>
    </g>
  </g>
</svg>
