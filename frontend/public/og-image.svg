<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="50%" stop-color="#12121A"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="200" r="180" fill="#8B5CF6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="220" fill="#22D3EE" opacity="0.1" filter="blur(70px)"/>

  <!-- Inner Card -->
  <rect x="80" y="80" width="1040" height="470" rx="28" fill="#12121A" fill-opacity="0.8" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Badge -->
  <rect x="140" y="140" width="340" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.3"/>
  <text x="310" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#A78BFA" text-anchor="middle" letter-spacing="1">B.TECH CSE &bull; 2023–2027</text>

  <!-- Title -->
  <text x="140" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">Mukesh Pramanik</text>

  <!-- Subtitle -->
  <text x="140" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#E2E8F0">Data Analytics &bull; Python Development &bull; AI/ML Systems</text>

  <!-- Tech tags -->
  <text x="140" y="440" font-family="monospace" font-size="16" fill="#94A3B8">Python &bull; SQL &bull; Pandas &bull; Scikit-learn &bull; Excel &bull; Power BI &bull; Next.js</text>
  <text x="140" y="480" font-family="monospace" font-size="14" fill="#22D3EE">https://github.com/Mukeshpramanik</text>
</svg>
