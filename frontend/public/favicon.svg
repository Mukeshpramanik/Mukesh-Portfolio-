<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="70%" stop-color="#0A0A12" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Silver M Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="80%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Purple P Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="75%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGlow)" />
  <circle cx="64" cy="64" r="61" fill="none" stroke="#9333EA" stroke-width="1.5" opacity="0.6" />

  <!-- Outer Neon Halo Arc -->
  <path d="M 20 64 A 48 48 0 1 1 108 80" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.4" filter="url(#purpleGlow)" />

  <!-- Star Sparkle -->
  <path d="M 50 25 Q 50 31 46 31 Q 50 31 50 37 Q 50 31 54 31 Q 50 31 50 25 Z" fill="#D8B4FE" opacity="0.9" />

  <!-- Letter M (Silver Brushed) -->
  <path d="M 30 40 L 46 40 L 54 62 L 62 40 L 68 40 L 68 84 L 59 84 L 59 55 L 52 74 L 48 74 L 41 55 L 41 84 L 30 84 Z" fill="url(#silverGrad)" />

  <!-- Letter P (Futuristic Purple) -->
  <path d="M 70 40 L 92 40 C 101 40 106 45 106 53 C 106 61 101 66 92 66 L 80 66 L 80 84 L 70 84 Z M 80 49 L 80 57 L 91 57 C 94 57 96 56 96 53 C 96 50 94 49 91 49 Z" fill="url(#purpleGrad)" />

  <!-- Sweeping Planetary Orbit Ring -->
  <path d="M 16 80 C 18 84 28 88 44 88 C 76 88 108 72 118 52 C 122 44 116 38 106 38 C 94 38 72 48 48 62 C 30 72 18 78 16 80 Z" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#purpleGlow)" />
</svg>
